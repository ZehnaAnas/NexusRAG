# docker-compose lets you describe your WHOLE stack (backend,
# frontend, and later things like Redis or Postgres) in one file, and
# bring it all up with one command: `docker compose up`.
#
# Secrets: this file reads OPENAI_API_KEY / COHERE_API_KEY /
# UNSTRUCTURED_API_KEY from a .env file sitting NEXT TO this
# docker-compose.yml (create one from .env.example). Docker Compose
# loads that automatically — nothing here contains a real secret.

services:
  backend:
    build: .              # use the Dockerfile in this directory
    ports:
      - "8000:8000"       # host_port:container_port
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - UNSTRUCTURED_API_KEY=${UNSTRUCTURED_API_KEY}
    volumes:
      # A NAMED VOLUME, not a Windows folder bind mount.
      #
      # The earlier version mounted ./utils/data (a folder on your
      # Windows filesystem) into the container. That persists data
      # fine, but Docker Desktop translates Windows paths through a
      # filesystem layer that does NOT fully support POSIX file
      # locking -- and SQLite needs locking plus side files (journal/
      # WAL) to open a database for writing. That's what produced
      # "unable to open database file" even though the file existed.
      #
      # A named volume lives inside Docker's Linux VM, so SQLite gets
      # real POSIX semantics. Data still survives restarts, rebuilds,
      # and `docker compose down`.
      #
      # Trade-off: you can no longer browse these files in Windows
      # Explorer. To inspect them:
      #   docker compose exec backend ls /app/utils/data
      - nexusrag-data:/app/utils/data

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  nexusrag-data: